<script>
"use strict";
const {axes,items,profiles}={"axes":[["靠近方式","A","主动","S","慢热","喜欢时会先制造见面的机会","需要几次稳定相处才愿意表态"],["相处距离","C","陪伴","I","空间","通过日常联系感受亲密","通过保留独处时间维持舒服的距离"],["冲突处理","T","先谈","R","先缓","倾向尽快说清发生了什么","倾向整理好情绪再继续聊"],["关系节奏","P","计划","F","随性","习惯早点确认对未来的想法","更愿意从当下的相处中慢慢确认"]],"items":[["有好感时，我会主动提出下次见面的时间。","喜欢一个人时，我通常会等对方先发出明确的邀约。","和喜欢的人聊得开心，我会直接告诉对方。","就算互有好感，我也想多相处几次才表态。","约会结束后，我愿意先发消息说自己今天很开心。","在确定对方也喜欢我之前，我很少释放明确的信号。","暧昧停在原地时，我愿意开口问对方怎么想。","比起早早让对方知道我的心意，我更习惯慢慢熟悉。"],["就算只是聊今天吃了什么，我也喜欢跟恋人分享。","就算关系稳定，我也希望每周有一段完全由自己安排的时间。","休息日没有安排时，我通常想约恋人一起过。","恋人忙自己的事情时，我很享受各做各的。","如果两个人都在忙，我也希望每天找个时间聊几句。","即使很想念对方，我也倾向保留原先约好的独处时间。","对我来说，一起做饭或散步就是很重要的亲密感。","我喜欢和恋人各自有一些不会重叠的兴趣和安排。"],["察觉彼此有误会时，我通常想尽快把它说开。","有分歧时，我想先安静一会儿，等情绪平稳再谈。","约会临时取消让我不舒服时，我愿意当时就把感受说出来。","争执刚发生时，给我一点时间比继续问我更有用。","如果聊天里有一句话让我介意，我愿意当天问清楚。","比起马上解释自己，我更需要先理清到底在介意什么。","就算还没想好解决办法，我也愿意先谈谈刚才发生的事。","意见不合时，我更愿意另约一个时间把话讲完整。"],["关系稳定下来后，我想早点谈谈接下来半年的安排。","只要当下相处舒服，未来的事可以等具体了再谈。","可能异地时，我会提前商量见面和联系的频率。","就算有机会提前定下来，我也喜欢给下次约会留一点临时发挥。","做出会影响两个人的大决定前，我习惯一起列清可选方案。","比起定下关系的时间表，我更愿意看相处中自然出现的机会。","共同旅行时，我希望出发前商量好大致计划。","我乐于先试一种相处方式，过一段时间再决定是否固定下来。"]],"profiles":[["ACTP","甜心发起人","🐻","你会主动约见面，也会把一起过的日子排进日历。恋人临时忙起来时，你可能同时失去陪伴和确定感。","把见面改成新约定，比如『今晚赶不上了，那周六午饭一起吃？』"],["ACTF","心动气氛组","🐶","喜欢就表达，想念就联系，出门绕个路也能变成约会。发生误会时，你愿意开口，但可能很快跳回轻松气氛。","把还没聊完的事留一句收尾，比如『刚才说的回复频率，我们明天定一下。』"],["ACRP","温柔筑巢派","🐹","你擅长把亲密感做成可持续的日常，睡前通话、固定见面都有你的安排。争执时突然变安静，可能让习惯高频联系的恋人有点不安。","暂停前说清楚『我需要半小时整理一下，九点回来聊。』"],["ACRF","拥抱冒险家","🐰","你会主动拉着喜欢的人去试新鲜事，也很在意一起做事的感觉。气氛不对时，你常先用一个轻松的小行动拉近距离。","送饮料或发可爱表情之后，可以补问『刚才哪句话让你最不舒服？』"],["AITP","独立领航员","🦊","你敢表达喜欢，也习惯把彼此的安排提前谈清楚。你能给对方自由，但太快进入解决问题的模式时，对方可能还没来得及说感受。","先问『你想我听一会儿，还是现在一起想办法？』"],["AITF","自由直球派","🐱","有好感时你乐于迈出第一步，关系稳定后也希望继续保有自己的生活。你喜欢把问题当下谈清楚，但不急着为关系定太远的计划。","如果对方想确认未来，先谈一个够近的节点，比如下个月怎么安排周末。"],["AIRP","从容掌舵手","🐧","你会发起约会，也愿意提前把距离和边界谈清楚。发生矛盾时，你更喜欢独处整理一遍再回来，让话说得更完整。","告诉对方你什么时候会回来，并把回来的第一句话留给刚才的矛盾。"],["AIRF","随心旅伴","🐸","你有兴趣就主动靠近，也喜欢保留彼此的临时安排。冲突来得突然时，你的第一反应可能是离开现场，让情绪降下来。","如果暂时不确定几点能谈，可以约好『今晚十点前我会告诉你我准备好没有。』"],["SCTP","细水陪伴派","🐑","喜欢会慢慢确认，一旦稳定下来，你会腾出固定时间陪伴。你愿意把问题摊开聊，聊完还希望彼此有一个下一步。","如果对方还没准备好决定，先约一个试行一周的小安排。"],["SCTF","慢熟贴心鬼","🐨","你的热情常在熟悉之后出现，可能是分享晚饭、顺路接人、一起追剧。遇到误会时你想说清楚，却未必会主动讲长远的打算。","在一次舒服的相处之后，说一句『下个月我也想继续保留这段时间给我们。』"],["SCRP","暖灯守候者","🦌","你需要时间确认安全感，之后会用稳定陪伴表达喜欢。矛盾出现时，你可能先把它想成关系方向出了问题，再慢慢开口。","先把范围缩到眼前这一件事，例如『我介意的是今天临时改时间，没有说我们不合适。』"],["SCRF","软糖同伴","🐼","你慢慢敞开心扉，熟悉以后很享受两个人随意待在一起。小摩擦过后，你可能等气氛自然回暖，却漏掉真正让自己介意的部分。","下次一起散步时，挑一句具体的话复盘，给对方一个理解你的机会。"],["SITP","安静协调员","🦉","你慢热，也需要稳定的独处时间。熟悉以后遇到分歧，你反而愿意直接谈，并用清楚的安排把双方的需求放进去。","说清你安排独处的时间，也主动发出下一次见面的邀请。"],["SITF","清醒漫游者","🦦","你喜欢慢慢熟悉，愿意让两个人各自保留生活。相处中真有事，你可以直接讲清楚，平时却未必习惯主动确认关系。","偶尔明确说出正在发生的喜欢，例如『我很喜欢最近和你见面的感觉。』"],["SIRP","慢热规划派","🐇","喜欢一个人时，你会记住对方说过的小事，愿意留时间见面，但需要多相处才会直接表态。你对未来有想法，却习惯先在心里整理好。","把准备的过程说出来，比如『我想想异地怎么见面，周末我们一起聊聊？』"],["SIRF","月光慢行者","🦭","你需要自己的空间，也喜欢让关系慢慢找到舒服的速度。遇到分歧先退一步能帮你组织语言，但太多事情都等自然发生，彼此可能一直猜。","挑一件最在意的小事约个时间开口，例如『这周找个晚上聊聊我们各自想要多少独处时间。』"]]};

function quiz(){
 const offset=page*pageSize;
 return '<form class="panel quiz" id="quiz"><div class="row"><h1>恋爱情境题</h1><b>'+ (page+1)+' / '+totalPages+' 页</b></div><progress aria-label="答题进度" max="'+questions.length+'" value="'+answers.filter(Number.isInteger).length+'"></progress>'+questions.slice(offset,offset+pageSize).map((q,i)=>{
  const index=offset+i;
  return '<fieldset><legend><b>'+String(index+1).padStart(2,"0")+'</b>'+q.text+'</legend><div class="choices">'+names.map((name,j)=>{
   const value=j-3;
   return '<label class="choice" title="'+name+'" style="--size:'+(20+Math.abs(value)*5)+'px;--tone:'+ (value<0?'#9c66ba':value>0?'#b82766':'#866b79')+'"><input type="radio" aria-label="'+name+'" name="q'+index+'" value="'+value+'" '+(answers[index]===value?'checked':'')+'><span aria-hidden="true">'+(value===0?'·':'')+'</span></label>';
  }).join("")+'</div><div class="ends" aria-hidden="true"><span>非常不同意</span><span>中立</span><span>非常同意</span></div></fieldset>';
 }).join("")+'<p class="status" role="status"></p><div class="row navrow"><button type="button" class="ghost" data-action="previous">'+(page?'← 上一页':'← 首页')+'</button><button class="primary" type="submit">'+(page+1===totalPages?'查看报告':'下一页 →')+'</button></div></form>';
}
function score(values){
 const scores=axes.map(()=>0);
 questions.forEach((q,i)=>{scores[q.axis]+=q.sign*values[i]});
 const code=scores.map((n,i)=>n===0?(values[24+i]-values[28+i]>=0?axes[i][1]:axes[i][3]):axes[i][n>0?1:3]).join("");
 return {code,scores:scores.map(n=>Math.round(50+n*50/24))};
}
function gallery(){
 return '<section class="gallery"><div class="row"><h1>16 型恋爱图鉴</h1><button class="ghost" data-action="galleryBack">← 返回</button></div><p class="lead">点开任意类型，看看不同的人如何表达喜欢、建立亲密感和处理分歧。</p><div class="cards">'+profiles.map(typeCard).join("")+'</div></section>';
}
function report(personal){
 const code=personal?result.code:activeCode;
 const i=profiles.findIndex(p=>p[0]===code);
 const [,title,emoji,summary,tip]=profiles[i];
 const chosen=axes.map((axis,j)=>axis[code[j]===axis[1]?5:6]);
 const tendency=personal?'<section class="article"><h2>你的四个恋爱维度</h2><div class="scores">'+axes.map(([label,a,left,b,right,pos,neg],j)=>{
  const pct=result.scores[j];
  const distance=Math.abs(pct-50);
  const note=distance===0?'两边的答题得分相同，类型字母参考该维度最后两题。':distance<=10?'两边接近，可能随对象和情境切换。':(distance>=25?'倾向明显，通常会':'稍有偏好，往往会')+(pct>50?pos:neg)+'。';
  return '<div class="score"><strong>'+label+'</strong><div class="track" aria-hidden="true"><div class="fill" style="width:'+pct+'%"></div></div><div class="pair"><span>'+a+' '+left+' '+pct+'%</span><span>'+(100-pct)+'% '+right+' '+b+'</span></div><p>'+note+'</p></div>';
 }).join("")+'</div></section>':'<p class="footnote">'+axes.map((a,j)=>code[j]+' '+a[code[j]===a[1]?2:4]).join("　·　")+'</p>';
 const mismatch=(code[1]==="C"?'对方如果需要较多独处，约好什么时候再联系，能少一点猜测。':'对方如果喜欢经常联系，提前说明自己需要多久独处，再约一个重新联系的时间。')+(code[2]==="T"?' 想尽快说清楚时，可以先问对方现在有没有余力聊。':' 想先静一静时，说清大概什么时候回来聊，会更容易让对方安心。');
 return '<article class="panel report"><div class="row"><span class="eyebrow">'+(personal?'你的恋爱人格报告':'类型图鉴 · 示例报告')+'</span><button class="ghost" data-action="'+(personal?'edit':'profileBack')+'">'+(personal?'← 修改答案':'← 返回')+'</button></div><div class="banner" style="--card:'+colors[i%4]+'"><span class="mascot" aria-hidden="true">'+emoji+'</span><div><p class="code">'+code+'</p><h1>'+title+'</h1></div></div><p>'+summary+'</p>'+tendency+'<section class="article"><h2>心动与日常</h2><p>在互有好感的时候，你'+chosen[0]+'。相处稳定以后，你'+chosen[1]+'。</p></section><section class="article"><h2>容易卡住的地方</h2><p>遇到分歧时，你'+chosen[2]+'。'+mismatch+'</p></section><section class="article"><h2>关于未来与相处建议</h2><p>走到需要做决定的时候，你'+chosen[3]+'。</p><blockquote>'+tip+'</blockquote></section><div class="buttons"><button class="primary" data-action="'+(personal?'share':'start')+'">'+(personal?'复制我的结果':'测测我是哪一型')+'</button>'+(personal?'<button class="ghost" data-action="restart">重新测试</button>':'')+'<button class="ghost" data-action="gallery">全部类型</button></div><p class="status" role="status"></p><textarea class="shareField" aria-label="可复制的结果文字" readonly hidden></textarea></article>';
}
function show(next){
 screen=next;
 const render={home,quiz,gallery,profile:()=>report(false),result:()=>report(true)};
 app.innerHTML=render[next]();
 const heading=app.querySelector("h1");
 heading.tabIndex=-1;
 heading.focus({preventScroll:true});
 window.scrollTo(0,0);
}
function begin(reset){
 if(reset||result){answers=[];page=0;result=null;}
 show("quiz");
}
async function share(){
 const profile=profiles.find(p=>p[0]===result.code);
 const status=app.querySelector(".status");
 const field=app.querySelector(".shareField");
 const link=location.protocol.startsWith("http")?"\n"+location.href.split(/[?#]/)[0]:"";
 field.value="我的恋爱人格是 "+profile[0]+" · "+profile[1]+" "+profile[2]+"。你是哪一型？"+link;
 try{await navigator.clipboard.writeText(field.value);status.textContent="已复制，可以发给朋友了。";}
 catch{field.hidden=false;field.focus();field.select();status.textContent="可以手动复制下面的文字。";}
}
app.addEventListener("change",event=>{
 const input=event.target;
 if(screen!=="quiz"||input.type!=="radio")return;
 answers[Number(input.name.slice(1))]=Number(input.value);
 result=null;
 app.querySelector("progress").value=answers.filter(Number.isInteger).length;
 app.querySelector(".status").textContent="";
});
app.addEventListener("submit",event=>{
 event.preventDefault();
 const offset=page*pageSize;
 const missing=questions.slice(offset,offset+pageSize).findIndex((_,i)=>!Number.isInteger(answers[offset+i]));
 if(missing>=0){
  app.querySelector(".status").textContent="第 "+(offset+missing+1)+" 题还没选。";
  app.querySelector('[name="q'+(offset+missing)+'"]').focus();
 }else if(page+1<totalPages){page++;show("quiz");}
 else{result=score(answers);show("result");}
});
document.addEventListener("click",event=>{
 const b=event.target.closest("[data-action]");
 if(!b)return;
 switch(b.dataset.action){
 case "home":show("home");break;
 case "start":begin(false);break;
 case "restart":begin(true);break;
 case "previous":if(page){page--;show("quiz");}else show("home");break;
 case "edit":page=totalPages-1;show("quiz");break;
 case "gallery":
  if(screen==="gallery")break;
  if(screen!=="profile")galleryFrom=screen;
  else if(profileFrom!=="gallery")galleryFrom=profileFrom;
  show("gallery");break;
 case "galleryBack":show(galleryFrom);break;
 case "profile":case "sample":
  profileFrom=screen;
  activeCode=b.dataset.code||"SIRP";
  show("profile");break;
 case "profileBack":show(profileFrom);break;
 case "share":share();break;
 }
});
show("home");
</script>
