const {axes,items,profiles}={"axes":[["靠近方式","A","主动","S","慢热","喜欢时会先制造见面的机会","需要几次稳定相处才愿意表态"],["相处距离","C","陪伴","I","空间","通过日常联系感受亲密","通过保留独处时间维持舒服的距离"],["冲突处理","T","先谈","R","先缓","倾向尽快说清发生了什么","倾向整理好情绪再继续聊"],["关系节奏","P","计划","F","随性","习惯早点确认对未来的想法","更愿意从当下的相处中慢慢确认"]],"items":[["有好感时，我会主动提出下次见面的时间。","喜欢一个人时，我通常会等对方先发出明确的邀约。","和喜欢的人聊得开心，我会直接告诉对方。","就算互有好感，我也想多相处几次才表态。","约会结束后，我愿意先发消息说自己今天很开心。","在确定对方也喜欢我之前，我很少释放明确的信号。","暧昧停在原地时，我愿意开口问对方怎么想。","比起早早让对方知道我的心意，我更习惯慢慢熟悉。"],["就算只是聊今天吃了什么，我也喜欢跟恋人分享。","就算关系稳定，我也希望每周有一段完全由自己安排的时间。","休息日没有安排时，我通常想约恋人一起过。","恋人忙自己的事情时，我很享受各做各的。","如果两个人都在忙，我也希望每天找个时间聊几句。","即使很想念对方，我也倾向保留原先约好的独处时间。","对我来说，一起做饭或散步就是很重要的亲密感。","我喜欢和恋人各自有一些不会重叠的兴趣和安排。"],["察觉彼此有误会时，我通常想尽快把它说开。","有分歧时，我想先安静一会儿，等情绪平稳再谈。","约会临时取消让我不舒服时，我愿意当时就把感受说出来。","争执刚发生时，给我一点时间比继续问我更有用。","如果聊天里有一句话让我介意，我愿意当天问清楚。","比起马上解释自己，我更需要先理清到底在介意什么。","就算还没想好解决办法，我也愿意先谈谈刚才发生的事。","意见不合时，我更愿意另约一个时间把话讲完整。"],["关系稳定下来后，我想早点谈谈接下来半年的安排。","只要当下相处舒服，未来的事可以等具体了再谈。","可能异地时，我会提前商量见面和联系的频率。","就算有机会提前定下来，我也喜欢给下次约会留一点临时发挥。","做出会影响两个人的大决定前，我习惯一起列清可选方案。","比起定下关系的时间表，我更愿意看相处中自然出现的机会。","共同旅行时，我希望出发前商量好大致计划。","我乐于先试一种相处方式，过一段时间再决定是否固定下来。"]],"profiles":[["ACTP","邀约策划者","订好下次约会","你愿意发起联系，也会把答应的事落实。对方跟你在一起，通常很清楚下次什么时候见。","你容易把自己的主动当成一份账单。约了三次都由你提，你可能开始算谁付出更多，或者拿自己排好的时间表催对方表态。","对方连续两次改约，你可能接着追问周末、下周和以后怎么安排。你在求一个确定的答复，对方听到的可能是现在必须交卷。","适合你的节奏是彼此都有发起邀约的机会，忙的时候也能主动交代。长期相处要给对方留出真正可以拒绝或改主意的余地。","「最近几次都是我在约，我有点失落。下次你想见面的话，可以由你来定吗？」"],["ACTF","气氛创作者","用相机记录快乐","你让喜欢变得好懂。想见就约，遇到误会也愿意先开口，关系里很少长期冷场。","你可能把热闹当成关系已经恢复。刚争执完就发梗图、约夜宵，对方跟着笑了，你就默认那件事翻篇。","对方回复变慢时，你可能连续抛出新话题或临时邀约，试图找回以前的热度。对方需要喘气时，这会像催回复。","新鲜感能带你们靠近，日常里的小承诺决定对方敢不敢依赖你。一起玩得开心以后，也记得落实说过的事。","「刚才气氛好一些了，但我想确认那件事有没有聊完。你想今晚说，还是明天说？」"],["ACRP","日常营造者","照料共同的日常","你会把关心放进固定的日常里。比如知道对方加班，提前问要不要留饭，也愿意在压力下先整理情绪。","你可能替对方安排太多，然后在心里等一份同等用心。对方没察觉，你表面还在照顾人，心里已经觉得自己被亏待。","固定通话被忘掉时，你可能照常回一句『没事』，之后突然停止分享。对方往往只能看到你变冷，猜不到你是从哪天开始失望的。","稳定联系对你重要，频率最好一起定。你也需要有可以直接请求照顾的时候，关系才能走出单方面兜底。","「我说没事，其实有点介意。这个通话对我很重要，我们能不能换成一个都能做到的时间？」"],["ACRF","体验发起者","带两杯咖啡来见你","你会主动把两个人带进共同体验。去逛没去过的街、顺路带杯饮料，都是你表达喜欢的方式。","你可能用亲热跳过道歉。对方还在生气时，你先抱过去、开玩笑或塞一份礼物，容易让对方觉得严肃说话也没用。","约会时起了争执，你可能先转身去买吃的，回来期待继续玩。如果没有交代，这个短暂离开也会被理解成丢下对方。","你们可以保留随兴约会，也可以约定遇到什么事必须当天约个时间聊。对方说暂时不想拥抱时，给他这个选择。","「我刚才想用玩笑缓一下，但我还没听懂你为什么难过。现在方便说说吗？」"],["AITP","边界协商者","把彼此的安排说清楚","你敢主动表达，也乐意把边界、见面频率和后续计划谈清楚。对方不用费力猜你的立场。","你可能把感情谈成工作会议。对方刚说『我挺难过的』，你就开始纠正时间线、给方案，还希望当场定下来。","对方反复改变想法时，你可能直接把安排收回，认为自己一个人决定更省事。对方感受到的可能是被排除在关系之外。","明确的计划适合你，重大安排要给双方留考虑时间。有些谈话只需要彼此明白发生了什么，下一步可以另约。","「我先把方案放一下。你刚才说难过，最让你难受的是哪一部分？」"],["AITF","坦诚探索者","率先说出真实想法","你能直接说出喜欢和不舒服，也给彼此保留朋友、兴趣和私人时间。和你相处常有一种轻松感。","你可能享受关系带来的亲密，同时回避确认自己愿意给多少承诺。对方问得多了，你容易把这个问题本身理解成限制自由。","一听到『以后怎么办』，你可能先辩论为什么不必计划，或者用『顺其自然』结束话题。对方仍然得靠猜决定要不要继续投入。","你可以保留对远期的弹性，并给近期一个可兑现的答案，比如是否排他、下个月能不能固定留一天见面。","「半年后的事我还没想清楚。现在我能答应的是每周见一次，过一个月我们再确认。」"],["AIRP","秩序协调者","停一下再好好谈","你既能主动推进，又能守住自己的节奏。你常愿意提前谈安排，发生争执时也会留时间把话想完整。","你可能把暂停用成单方面收回沟通权。什么时候停、什么时候恢复、最后怎么定，都由你在心里决定，对方只能等通知。","谈到独处时间或搬家安排时，你可能突然变得很冷静，然后直接做决定。对方容易觉得自己的意见只是被听了一遍。","暂停的时长可以先约好，重大决定可以让双方各带一个方案。这样你有准备时间，对方也有参与感。","「我想先停四十分钟。八点我回来，我们各讲一个自己能接受的方案。」"],["AIRF","即兴行旅者","跟着地图即兴出发","你愿意主动约人，也欣赏两个人各自过好生活。计划变了，你通常能轻松换一个玩法。","你可能很擅长开启一段互动，却把后续确认留给对方。约得突然、改得也突然时，对方的时间容易被当成随时可以挪的。","关系一紧张，你可能把手机放一边，等有心情了再回来。对方若不知道你会不会回来，短暂冷静就会像突然失联。","随性适合小安排。涉及对方特意空出来的时间时，提前告知变动，改约也由提出变动的人负责。","「今天我需要静一下。今晚十点前我会回你，明天的见面我也会重新提两个时间。」"],["SCTP","关系经营者","把陪伴留进日常","你在确认关系后很愿意投入稳定的陪伴，也能就具体的问题开口。一起建立固定日常是你的长处。","你可能把自己的等待和耐心攒成隐形期待。前期一直等对方表态，后期又期待对方主动理解你希望多亲密、多稳定。","对方少联系几天，你可能一次性把好几周的委屈都说出来，还要求马上明确接下来怎么办。对方容易只听到指责。","把需要分成小件提出来，例如一周见几次、忙时能不能报个平安。谈完先试一段时间，双方都可以反馈。","「我想先说这周少联系这件事。你这几天是太忙了，还是想把联系频率调低一点？」"],["SCTF","日常记录者","把喜欢的点心分给你","你熟悉以后很会照顾日常，也愿意把眼前的误会说开。相处久了，你能给人很自然的亲密感。","你可能默认每天聊天、见面就代表双方想得一样。等对方说还没确认关系时，你会觉得那些相处都被否定。","对方开始忙，你可能愿意谈这几天少聊了，却一直绕开『我们对这段关系有什么期待』。谈完一次，类似问题很快再来。","你可以继续享受平常的陪伴，也可以在一个舒服的时刻确认彼此怎么看现在这段关系。","「我发现我已经很把这段关系当回事了。你现在怎么看我们之间的关系？」"],["SCRP","信任守护者","耐心修补旧围巾","你愿意慢慢建立信任，确认之后往往记得对方的习惯，也会认真安排长期相处。","你可能嘴上体谅对方，心里却偷偷记分。积攒久了，一次迟到就会被你读成『我总是排在最后』，对方只知道今天迟到了。","固定约会取消时，你可能先沉默，在心里把过去类似的事都串起来。等开口时，眼前的小事已经变成对整段关系的质疑。","你的关系需要稳定的小约定，也需要允许偶尔例外。失望刚出现时，说出具体那一次，后面更容易协商。","「我介意的是今天临时改时间。我为了见面推掉了别的安排，下次能提前告诉我吗？」"],["SCRF","细节感知者","默默递来一把伞","你熟悉以后很容易创造放松的相处感。就算两个人各自做事，待在同一个空间也会觉得亲近。","你可能太依赖气氛来决定什么时候开口。等到气氛好，又担心破坏它，于是用正常聊天掩盖还没说过的委屈。","对方冒出一句让你不舒服的话，你可能笑笑过去，之后却不太想见他。对方感觉到距离，却无从知道哪句话刺到了你。","轻松的关系也能留一个固定时间谈不顺的事。把问题限定在一件具体的小事，常比等一个完美时机容易。","「上次你开我那个玩笑，我当时笑了，其实有点尴尬。以后可以别拿这个逗我吗？」"],["SITP","节奏协调者","给见面和独处都留时间","你需要时间熟悉对方，也能在熟悉以后清楚地谈问题。你擅长把独处需求和长期安排说具体。","你可能把所有需求都说成安排，省略了感情。对方问『你想我吗』，你回『周六有空』，他可能只听出行程，没听到喜欢。","对方临时想多见一面，你可能马上拿既定安排挡回去。如果这个模式反复发生，对方会觉得自己总排不进你的生活。","稳定的边界适合你。主动留一个共同时间，偶尔明确表达自己期待见面，能让对方不用从日历里猜感情。","「我今晚想留给自己。周六我有空，也是真的想见你，要不要一起吃晚饭？」"],["SITF","独立观察者","在自己的世界里写写画画","你能给关系呼吸的空间，事情真正发生时也愿意直接讲清楚。和你相处，各自的生活通常可以保留。","你可能把『对方没问』理解成『这件事不用说』。联系很久也不说自己想把关系放在哪里，主动承担不确定性的就成了对方。","被问到关系时，你可能把回答说得很准确却很冷，例如只说『目前相处还行』。对方会知道你在评估，却不知道你在乎什么。","保留开放的节奏时，可以定期确认投入是否对等。清楚说出你已经确定的部分，会比只列你还没确定的事更有用。","「我还需要时间想长期安排，但我确定自己想继续和你见面，也愿意听你现在需要什么。」"],["SIRP","关系规划者","提前查好下一次见面的车次","你喜欢得慢，往往先用行动表示。会记住对方说过的小事，也会提前想好见面、异地和各自的生活怎么安排。","你可能把不安藏进『先观察一下』。等对方主动、看对方会不会记住细节，失望了就往后退。对方可能根本不知道自己在被观察。","吵架后，你可能把一段沉默当成整理思绪，对方却把它理解成冷处理。等你在心里连未来安排都改好了，对方还在等你回刚才那句话。","你需要可预期的安排和个人空间。重要的是把预期讲出来，比如忙时怎么联系、多久见一次。心里排得再清楚，双方也要一起确认。","「我现在有点乱，想缓半小时，九点回来聊。刚才你说周末可能不见面，我其实有点失落。」"],["SIRF","安静同行者","安静享受各自的时间","你愿意给关系时间，也给两个人留下独处的余地。你通常能接受感情在真实相处中慢慢变化。","你可能用『顺其自然』躲过需要做的选择。对方一直负责发起和确认，你习惯跟着走，等对方累了才发现自己也舍不得。","一遇到压力，你可能先减少联系，打算等想清楚再回来。没有时间约定的话，沉默很容易变成一种没有说出口的拒绝。","你可以先承诺一个很小的下一步，例如周日通话一次。小约定能保留弹性，也让关系有机会往前走。","「我还没想好长远怎么走，但我愿意继续了解你。周日我们聊二十分钟，看看彼此想要什么？」"]]};
const situations=[[["一次约会结束后，即使对方没有先发消息，我也会说出自己想再见面。","约会之后谁先开口","你愿意让对方知道这次见面有意义，减少两个人互相猜的时间。对方暂时没回应时，一次清楚的邀请已经传达了心意，反复追问会增加压力。","你倾向先观察对方有没有想继续的信号，能给彼此留出余地。如果你其实期待见面，可以先说『今天和你聊天很舒服』，让对方有机会接住。"],["我发现对方的态度变了时，更愿意多观察几次互动，再问对方怎么想。","态度忽冷忽热","你会让一次反常先过一过，避免把忙碌或走神都理解成冷淡。变化反复出现时，可以描述你看到的变化，再问对方的感受。","你愿意尽早确认变化，比较少把不安留到下次见面。开口时先说可观察的事，比如『这周我们聊得少了』，能让对方有空间给出自己的解释。"],["我有好感却拿不准对方的心意时，仍愿意用一次明确的邀约试试。","互有好感还不确定","你愿意承担一次被拒绝的可能，换一个更清楚的信号。用具体但容易拒绝的邀请，对方能自在回答，你也更容易看清有没有来回。","你会在投入更多之前看对方有没有回应。慢一点能保护自己的节奏，但只靠对方发起，也可能错过同样谨慎的人。"],["想确认是不是在认真交往时，我会先等对方主动聊起关系。","从暧昧到确认关系","你倾向看相处是否稳定，再让关系往前走。如果你已经在按伴侣的标准投入，可以问『你怎么看我们最近的相处』，把期待摆到桌面。","你更愿意自己打开确认关系的话题，双方可以更早发现期待差异。可以先交代你自己的感受，再邀请对方说出想法，给彼此留考虑时间。"]],[["忙了一天以后，和恋人简单聊几句通常能让我更放松。","忙完以后想怎么充电","轻量的日常联系对你有恢复作用。对方也累时，一条简短语音或约定晚点聊，可能比坚持通话更容易兼顾两个人。","你可能更习惯先给自己一点时间，再进入对话。说清什么时候会回消息，可以让你的独处更容易被理解。"],["恋人临时有别的安排时，我往往乐于把空出来的时间留给自己。","约会取消后怎么过","你能较快把时间转回自己的兴趣，关系不必承担你全部的休息需求。如果这次取消确实让你失落，也可以把失落说出来，让对方知道这次约会对你有分量。","你可能更想保留这次连接，比如改成短一点的见面或约个新时间。这份投入能维持亲近感，也值得给双方保留轻松改约的空间。"],["一周里即使各有各的事，我也希望保留一段固定的两人时间。","联系频率怎么定","固定的共同时间能让你更容易感到被放进对方的生活里。忙的时候一起商量最小安排，约定就更容易持续。","固定的频率对你可能没有那么重要，临时想见也能建立亲密感。如果恋人重视可预期性，可以先留一个大致窗口，再把具体时间说清楚。"],["即使感情很好，我也希望能和朋友单独聚会，保有自己的社交安排。","朋友圈要不要重叠","各自的朋友和安排能帮你维持自己的生活。主动介绍重要的人，或者约一次大家都舒服的聚会，也能让对方理解你的生活。","你可能更期待两个人进入彼此的朋友圈，共同经历更多事情。先问对方希望哪些活动一起参加，通常比默认每次都要同行更容易谈拢。"]],[["对方一句话让我不舒服时，就算不知道怎么解决，我也愿意先指出是哪句话。","听到一句刺耳的话","你愿意在问题还具体时把它说出来，能少积几笔旧账。把那句话和自己的感受说清楚，比立刻判断对方是不是故意更容易让谈话继续。","你倾向先弄懂自己介意的是什么。暂停有助于把事情讲清楚，可以先留一句『这句话我有点介意，晚一点我想和你说』。"],["争执中，如果我快说出气话，我会提议暂停，约个时间再谈。","争执升级时怎么刹车","你愿意给双方留一点冷静时间，也会交代何时回来。恢复谈话时先接回刚才没说完的事，可以让暂停真的发挥作用。","你可能更愿意保持对话，把眼前的事讲完。发现彼此已经只在反驳时，可以先问对方还有没有余力，必要时一起约个恢复时间。"],["对方说想晚点聊时，我会希望先听到一句他们现在介意的是什么。","对方先提出暂停","你希望有一个线索，好知道暂停后要谈什么。这能减少猜测，但对方可能还没想明白，可以接受一个简单的描述和约好的时间。","你可以接受对方先消化，再把事情讲完整。如果等待让你越来越不安，也可以只确认什么时候继续聊。"],["争执发生后，我通常需要先自己复盘，才说得清楚希望对方做什么。","从委屈到提出请求","你更容易在独处后找出具体的需要，开口时能说得比较完整。对方没经历你的复盘过程，回来时最好把触发点也一起讲出来。","你可能习惯一边谈一边弄明白自己在意什么。可以说『我现在还在想』，让对方知道你刚说的是探索中的想法，还有调整空间。"]],[["如果未来可能异地，我会想提前谈好多久见一次、忙时怎么联系。","异地之前怎么准备","你会把『我们想继续』变成可讨论的日常。安排得越具体，越需要确认双方的时间和成本，给现实变化留一个重新协商的节点。","你更可能等到知道实际作息，再决定怎样相处。可以先试一个短周期，比如两周，再一起回顾什么安排真正好用。"],["聊到一年后的事时，我通常想先过好眼下这段时间，等条件清楚了再定。","未来还没看清时","你愿意给关系和现实一点变化的空间。对方如果要做工作或居住选择，可以先说出你现在能确认的部分，以及哪天会重谈。","你可能希望先交换长期方向，再决定当下怎么走。你能早点发现差异，也可以明确哪些是已有共识，哪些只是目前的设想。"],["同住、搬家这类决定，我习惯先和恋人谈清时间、分工和预算。","做共同决定","你习惯把影响两个人的事摊开讨论，让付出和预期更清楚。谈分工前先问对方最担心什么，能避免把感受遗漏在表格之外。","你可能更愿意先试一种相处方式，再根据生活调整。涉及租金、合同或搬迁前，可以先约一个最低共识，确保双方都知道要承担什么。"],["如果一种相处安排暂时说不准，我喜欢先试几周，再一起决定是否固定。","要不要试行一段时间","你愿意从实际体验里调整，比较能接住作息和需求的变化。提前约好回顾日期，试行才有机会得到一个双方都认可的结果。","你更愿意在投入之前先确认安排，能让双方知道接下来怎么配合。对于很难提前判断的细节，先定原则，再留一个可调整的窗口。"]]];
const questions=[];
// Interleave dimensions and retain each new question's two interpretation paths.
const baseCount=items[0].length;
for(let row=0;row<baseCount+situations[0].length;row++){
 items.forEach((list,axis)=>{
  const situation=situations[axis][row-baseCount];
  questions.push({axis,sign:row%2===0?1:-1,text:situation?.[0]??list[row],situation});

let slideIndex=0,slideTimer,playing=true;
function carousel(){
 const panels=slideImages.map((src,i)=>'<div class="slide" aria-hidden="'+(i!==slideIndex)+'"><img src="'+src+'" width="1440" height="940" alt="'+slideDescriptions[i]+'"></div>');
 return '<section class="carousel" aria-label="恋爱类型封面轮播"><div class="slideFrame">'+panels.join("")+'<button class="slideArrow prev" data-action="slidePrev" aria-label="上一张">‹</button><button class="slideArrow next" data-action="slideNext" aria-label="下一张">›</button></div><div class="slideControls"><div class="slideDots">'+slideLabels.map((label,i)=>'<button data-action="slidePick" data-slide="'+i+'" aria-label="'+label+'" aria-current="'+(i===slideIndex)+'"></button>').join("")+'</div><button class="slideToggle" data-action="slideToggle">'+(playing?'暂停轮播':'继续轮播')+'</button></div><p class="sceneCaption">'+slideLabels[slideIndex]+'</p></section>';
}
function stopSlides(){
 clearInterval(slideTimer);
}
function startSlides(){
 stopSlides();
 if(playing&&screen==="home"&&!document.hidden)slideTimer=setInterval(()=>goSlide(slideIndex+1),5000);
}
function goSlide(index){
 const previous=slideIndex;
 slideIndex=(index+slideLabels.length)%slideLabels.length;
 if(previous===slideIndex)return;
 app.querySelectorAll(".slide").forEach((panel,i)=>{
  panel.setAttribute("data-underlay",i===previous);
  panel.setAttribute("aria-hidden",i!==slideIndex);
 });
 app.querySelectorAll("[data-slide]").forEach((dot,i)=>dot.setAttribute("aria-current",i===slideIndex));
 app.querySelector(".sceneCaption").textContent=slideLabels[slideIndex];
}
function pauseSlides(){
 playing=false;
 stopSlides();
 app.querySelector(".slideToggle").textContent="继续轮播";
}
function home(){
 const featured=["ACTP","ACRF","AITF","SIRP"].map(code=>profiles.find(p=>p[0]===code));
 return '<section class="hero"><div class="heroCopy"><p class="eyebrow">16 型恋爱人格测试</p><h1>恋爱里的你，<span>是什么型？</span></h1><p class="lead">从第一次心动，到吵架后的第一句话。用 48 道情境题，看看你怎么靠近一个人，又怎么和对方相处。</p><div class="buttons"><button class="primary" data-action="start">'+(answers.some(Number.isInteger)&&!result?'继续测试':'开始测试')+'　→</button><button class="ghost" data-action="sample">看看 SIRP</button></div><p class="footnote">七档作答 · 约 8–10 分钟</p></div>'+carousel()+'</section><section class="preview"><div class="row"><h2>遇见不同的恋爱类型</h2><button class="ghost" data-action="gallery">查看全部 →</button></div><div class="cards">'+featured.map(typeCard).join("")+'</div></section>';
}
function quiz(){
 const offset=page*pageSize;
 return '<form class="panel quiz" id="quiz"><div class="row"><h1>恋爱情境题</h1><b>'+ (page+1)+' / '+totalPages+' 页</b></div><p class="quizNote">按你在亲密关系中通常会怎么做来选。没有类似经历时，可以想象一个具体的人和情境。</p><progress aria-label="答题进度" max="'+questions.length+'" value="'+answers.filter(Number.isInteger).length+'"></progress>'+questions.slice(offset,offset+pageSize).map((q,i)=>{
  const index=offset+i;
  return '<fieldset><legend><b>'+String(index+1).padStart(2,"0")+'</b>'+q.text+'</legend><div class="choices">'+names.map((name,j)=>{
   const value=j-3;
   return '<label class="choice" title="'+name+'" style="--size:'+(20+Math.abs(value)*5)+'px;--tone:'+ (value<0?'#9c66ba':value>0?'#b82766':'#866b79')+'"><input type="radio" aria-label="'+name+'" name="q'+index+'" value="'+value+'" '+(answers[index]===value?'checked':'')+'><span aria-hidden="true">'+(value===0?'·':'')+'</span></label>';
  }).join("")+'</div><div class="ends" aria-hidden="true"><span>非常不同意</span><span>中立</span><span>非常同意</span></div></fieldset>';
 }).join("")+'<p class="status" role="status"></p><div class="row navrow"><button type="button" class="ghost" data-action="previous">'+(page?'← 上一页':'← 首页')+'</button><button class="primary" type="submit">'+(page+1===totalPages?'查看报告':'下一页 →')+'</button></div></form>';
}
function score(values){
 const scores=axes.map(()=>0);
 questions.forEach((q,i)=>{scores[q.axis]+=q.sign*values[i]});
 const code=scores.map((n,i)=>n===0?(values[values.length-2*axes.length+i]-values[values.length-axes.length+i]>=0?axes[i][1]:axes[i][3]):axes[i][n>0?1:3]).join("");
 return {code,scores:scores.map(n=>Math.round(50+n*50/axisMax))};
}
function gallery(){
 return '<section class="gallery"><div class="row"><h1>16 型恋爱图鉴</h1><button class="ghost" data-action="galleryBack">← 返回</button></div><p class="lead">点开任意类型，看看不同的人如何表达喜欢、建立亲密感和处理分歧。</p>'+groups.map((group,i)=>'<section class="group" style="--family:'+colors[i]+'"><h2>'+group+'</h2><div class="cards">'+profiles.slice(i*4,i*4+4).map(typeCard).join("")+'</div></section>').join("")+'</section>';
}
function answerCard(q,index,value,personal){
 const [,topic,agree,disagree]=q.situation;
 const interpretation=value===0
  ?"你选了中立。可以回想一次最接近的经历：当时你怎么做？换一个对象或时机，你的做法会不会变？"
  :value>0?agree:disagree;
 return '<article class="answerCard"><h4>'+topic+'</h4><p class="answerPrompt">第 '+(index+1)+' 题 · '+q.text+'</p><p class="answerPick">'+(personal?"你的选择":"示例选择")+' <strong>'+names[value+3]+'</strong></p><p>'+interpretation+'</p></article>';
}
function answersIn(axis,personal,code){
 const cards=questions.flatMap((q,index)=>{
  if(q.axis!==axis||!q.situation)return [];
  const value=personal?answers[index]:q.sign*(code[axis]===axes[axis][1]?2:-2);
  return [{q,index,value}];
 });
 cards.sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
 const render=({q,index,value})=>answerCard(q,index,value,personal);
 return '<div class="answerEvidence"><h3>'+(personal?"从你的答案看":"示例作答与解读")+'</h3>'+cards.slice(0,2).map(render).join("")
  +'<details><summary>展开另外两道情境题</summary>'+cards.slice(2).map(render).join("")+'</details></div>';
}
function report(personal){
 const code=personal?result.code:activeCode;
 const i=profiles.findIndex(p=>p[0]===code);
 const [,title,gesture,strength,blindSpot,pressure,daily,repair]=profiles[i];
 const tendency=personal?'<section class="article"><h2>你的四个恋爱维度</h2><div class="scores">'+axes.map(([label,a,left,b,right,pos,neg],j)=>{
  const pct=result.scores[j];
  const distance=Math.abs(pct-50);
  const note=distance===0?'两边的答题得分相同，类型字母参考该维度最后两题。':distance<=10?'两边接近，可能随对象和情境切换。':(distance>=25?'倾向明显，通常会':'稍有偏好，往往会')+(pct>50?pos:neg)+'。';
  return '<div class="score"><strong>'+label+'</strong><div class="track" aria-hidden="true"><div class="fill" style="width:'+pct+'%"></div></div><div class="pair"><span>'+a+' '+left+' '+pct+'%</span><span>'+(100-pct)+'% '+right+' '+b+'</span></div><p>'+note+'</p></div>';
 }).join("")+'</div></section>':'<p class="footnote">'+axes.map((a,j)=>code[j]+' '+a[code[j]===a[1]?2:4]).join("　·　")+'</p>';
 const [sceneTitle,ownVoice,otherVoice]=scenes[code];
 const chapters=[
  ["overview","类型速写",'<p>'+sceneTitle+'。</p>'+tendency+(personal?'<p class="quizNote">字母和百分比概括本次作答。类型正文提供常见情境，各章的「从你的答案看」会按你选的具体选项变化。</p>':'<p class="quizNote">以下按该类型的典型倾向模拟作答。四个情境章节都可以预览示例解读，完成测试后会按你实际选的答案生成个人报告。</p>')],
  ["balance","优势与盲点",'<div class="balance"><section><h3>恋爱中的优势</h3><p>'+strength+'</p></section><section><h3>阴暗面与盲点</h3><p>'+blindSpot+'</p></section></div>'],
  ["relationship","恋爱现场",'<h3>'+sceneTitle+'</h3><div class="perspectives"><blockquote class="voice"><strong>你可能会说</strong>「'+ownVoice+'」</blockquote><blockquote class="voice"><strong>对方可能会说</strong>「'+otherVoice+'」</blockquote></div>'+answersIn(0,personal,code)],
  ["distance","联系与空间",'<p>联系和独处的习惯会随工作强度、异地距离、关系阶段而变。先看你在哪些具体场景想靠近，又在哪些时候需要喘口气。</p>'+answersIn(1,personal,code)],
  ["pressure","冲突与压力",'<h3>压力下的反应</h3><p>'+pressure+'</p><div class="advice"><h3>怎么修复</h3><blockquote>'+repair+'</blockquote></div>'+answersIn(2,personal,code)],
  ["future","长期相处",'<h3>长期相处的磨合</h3><p>'+daily+'</p>'+answersIn(3,personal,code)]
 ];
 const directory='<aside class="chapters" aria-label="报告目录"><strong>报告目录</strong>'+chapters.map(([id,label])=>'<button class="chapter" data-action="chapter" data-section="'+id+'">'+label+'</button>').join("")+'</aside>';
 const sections=chapters.map(([id,label,body])=>'<section aria-labelledby="chapter-'+id+'"><h2 id="chapter-'+id+'" tabindex="-1">'+label+'</h2>'+body+'</section>').join("");
 const letters=axes.map((a,j)=>'<span>'+code[j]+' '+a[code[j]===a[1]?2:4]+'</span>').join("");
 return '<article class="panel report"><div class="row"><span class="eyebrow">'+(personal?'你的恋爱人格报告':'类型图鉴 · 模拟作答')+'</span><button class="ghost" data-action="'+(personal?'edit':'profileBack')+'">'+(personal?'← 修改答案':'← 返回')+'</button></div><div class="banner" style="--card:'+colors[Math.floor(i/4)]+'">'+portrait(profiles[i])+'<div><p class="code">'+code+'</p><h1>'+title+'</h1><div class="letters">'+letters+'</div><p class="pose">'+gesture+'</p></div></div><div class="reportLayout">'+directory+'<div class="reportStory">'+sections+'</div></div><div class="buttons"><button class="primary" data-action="'+(personal?'share':'start')+'">'+(personal?'复制我的结果':'测测我是哪一型')+'</button>'+(personal?'<button class="ghost" data-action="restart">重新测试</button>':'')+'<button class="ghost" data-action="gallery">全部类型</button></div><p class="status" role="status"></p><textarea class="shareField" aria-label="可复制的结果文字" readonly hidden></textarea></article>';
}
let pageTransition;
let hasRendered=false;
function show(next){
 stopSlides();
 screen=next;
 const render={home,quiz,gallery,profile:()=>report(false),result:()=>report(true)};
 app.innerHTML=render[next]();
 const heading=app.querySelector("h1");
 heading.tabIndex=-1;
 heading.focus({preventScroll:true});
 window.scrollTo(0,0);
 pageTransition?.cancel();
 if(hasRendered&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  pageTransition=app.animate?.([{transform:"translateY(3px)"},{transform:"translateY(0)"}],{duration:340,easing:"cubic-bezier(.2,.65,.35,1)"});
 }
 hasRendered=true;
 if(next==="home")startSlides();
}
function begin(reset){
 if(reset||result){answers=[];page=0;result=null;}
 show("quiz");
}
async function share(){
 const profile=profiles.find(p=>p[0]===result.code);
 const status=app.querySelector(".status");
 const field=app.querySelector(".shareField");
 const link=location.protocol.startsWith("http")?"\n"+location.href.split(/[?#]/)[0]:"";
 field.value="我的恋爱人格是 "+profile[0]+" · "+profile[1]+"。你是哪一型？"+link;
 try{await navigator.clipboard.writeText(field.value);status.textContent="已复制，可以发给朋友了。";}
 catch{field.hidden=false;field.focus();field.select();status.textContent="可以手动复制下面的文字。";}
}
app.addEventListener("change",event=>{
 const input=event.target;
 if(screen!=="quiz"||input.type!=="radio")return;
 answers[Number(input.name.slice(1))]=Number(input.value);
 result=null;
 app.querySelector("progress").value=answers.filter(Number.isInteger).length;
 app.querySelector(".status").textContent="";
});
app.addEventListener("submit",event=>{
 event.preventDefault();
 const offset=page*pageSize;
 const missing=questions.slice(offset,offset+pageSize).findIndex((_,i)=>!Number.isInteger(answers[offset+i]));
 if(missing>=0){
  app.querySelector(".status").textContent="第 "+(offset+missing+1)+" 题还没选。";
  app.querySelector('[name="q'+(offset+missing)+'"]').focus();
 }else if(page+1<totalPages){page++;show("quiz");}
 else{result=score(answers);show("result");}
});
document.addEventListener("click",event=>{
 const b=event.target.closest("[data-action]");
 if(!b)return;
 switch(b.dataset.action){
 case "slidePrev":goSlide(slideIndex-1);break;
 case "slideNext":goSlide(slideIndex+1);break;
 case "slidePick":goSlide(Number(b.dataset.slide));break;
 case "slideToggle":
  if(playing)pauseSlides();
  else{playing=true;b.textContent="暂停轮播";startSlides();}
  break;
 case "home":show("home");break;
 case "start":begin(false);break;
 case "restart":begin(true);break;
 case "previous":if(page){page--;show("quiz");}else show("home");break;
 case "edit":page=totalPages-1;show("quiz");break;
 case "gallery":
  if(screen==="gallery")break;
  if(screen!=="profile")galleryFrom=screen;
  else if(profileFrom!=="gallery")galleryFrom=profileFrom;
  show("gallery");break;
 case "galleryBack":show(galleryFrom);break;
 case "profile":case "sample":
  profileFrom=screen;
  activeCode=b.dataset.code||"SIRP";
  show("profile");break;
 case "profileBack":show(profileFrom);break;
 case "chapter": {
  const heading=app.querySelector("#chapter-"+b.dataset.section);
  heading.focus({preventScroll:true});
  heading.scrollIntoView({block:"start"});
  break;
 }
 case "share":share();break;
 }
});
document.addEventListener("visibilitychange",startSlides);
show("home");
</script>
</body>
</html>
